# Main parameters. Restart server.py after editing; reload the page.

[area]
width = 480          # drawing area, px
height = 480

[draw]
pencil_width = 14    # diameter of the dot marking the current point, px
trail_width = 20     # width of the trail drawn on screen, px

[inference]
timeout_s = 4.0      # seconds from a trail's first point until the digit is inferred (brief: 3–5 s)
stroke_width = 2.5   # trail width in the 28x28 image the network sees, px (MNIST strokes are ~2–3 px)

[server]
host = "127.0.0.1"   # who can open the page: this machine only; use its tailnet IP (or "0.0.0.0", every network) to open it from elsewhere
port = 8000
model = "model.npz"  # written by train.py

[esp32]
udp_port = 8001      # SERVER_PORT in firmware/config.h; listened on all network interfaces
# The drawing area in the apparatus's own frame (docs/apparatus.jpeg): x is the distance from the sensor on the
# Y axis, y the distance from the sensor on the X axis. Keep it inside the zone both ~15° beams cover, which is
# small near the sensors (a beam is ~50 mm wide at 200 mm). Readings outside it are dropped. Calibrate with the
# distances the ESP32 tab shows.
x_mm = [150, 250]    # left edge, right edge
y_mm = [150, 250]    # bottom edge, top edge
# Each sensor's readings are smoothed (plan M1.1): the median of the last median_of readings drops single-ping
# spikes and dropouts, then a low-pass filter evens out jitter. median_of = 1 and low_pass = 1.0 turn them off.
median_of = 3        # odd; 3 delays the point by one reading (~60 ms), each extra 2 by one more
low_pass = 0.5       # weight of the newest reading, above 0 up to 1; lower is smoother but lags more
